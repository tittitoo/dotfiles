# Intel AX200/201-class Bluetooth controller (hci0, firmware
# intel/ibt-0040-2120.sfi) on the StarLite crashes intermittently with
# "Bluetooth: hci0: Hardware error 0x0c", dropping the Toucan keyboard's
# connection - dozens of times a day, unrelated to system suspend/resume.
#
# The 99-starlite-bluetooth-no-autosuspend.rules udev rule (see ../udev/)
# forces the generic USB power/control sysfs attribute to "on", but btusb
# has its OWN independent autosuspend switch (enable_autosuspend, default
# Y) that operates below that - confirmed still "Y" with the udev rule
# active and the crash still recurring. Disable it here too.
options btusb enable_autosuspend=0
