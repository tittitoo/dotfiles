[[mgr.prepend_keymap]]
on = "!"
for = "unix"
run = 'shell fish --block'
desc = "Open fish here"

[[mgr.prepend_keymap]]
on = "<C-p>"
run = 'shell -- qlmanage -p %s'

[[mgr.prepend_keymap]]
on = "<C-y>"
run = 'shell -- copy-file-to-clipboard %s'
desc = "Copy file to clipboard"

[[mgr.prepend_keymap]]
on = "<C-s>"
run = 'shell -- get_sharepoint_link.py %s'
desc = "Get SharePoint link"

[[mgr.prepend_keymap]]
on = "<C-r>"
run = 'shell -- clean-text-outlook.py %s | pbcopy'
desc = "Copy reformatted Outlook folder name"

[[mgr.prepend_keymap]]
on = "<A-y>"
run = 'shell -- open -a Yoink %s'
desc = "Send to Yoink"

[[mgr.prepend_keymap]]
on = "<A-r>"
run = 'shell --block -- uv run %s'
desc = "Run Python script with uv"

[[mgr.prepend_keymap]]
on = [ "F", "G" ]
run = "plugin yafg"
desc = "Fuzzy grep with rg + fzf"

[[mgr.prepend_keymap]]
on = "<A-n>"
run = 'shell --block -- note-rename %s'
desc = "Rename note and fix [[links]] to it vault-wide"

[[mgr.prepend_keymap]]
on = "?"
run = "help"
desc = "Open help"

# macOS's trashItemAtURL (what yazi's native trash normally calls) fails on
# files inside OneDrive's ~/Library/CloudStorage with "you don't have
# permission to access it" while OneDrive is running -- a OneDrive File
# Provider bug, not a yazi bug (upstream: sxyazi/yazi#4406, closed as "not
# planned", OneDrive doesn't implement the API correctly). Route delete
# through hasseg's `trash` CLI instead, which moves files into ~/.Trash
# directly rather than calling that API.
[[mgr.prepend_keymap]]
on = "d"
for = "macos"
run = 'shell --block --interactive -- "/opt/homebrew/opt/trash/bin/trash" %*'
desc = "Move to trash (bypasses the OneDrive trashItemAtURL bug)"
