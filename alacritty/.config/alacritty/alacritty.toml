
[font]
# normal = { family = "VictorMono Nerd Font Mono", style = "Regular" }
normal = { family = "VictorMono Nerd Font Mono", style = "Light" }
# size intentionally omitted here — the importing file's own fields always
# win over imports, so it must be set per machine via local.toml instead.

[window]
decorations = "none"
option_as_alt = "Both"

[window.padding]
x = 7
y = 0

[general]
# themes from https://github.com/alacritty/alacritty-theme

import = [
    # uncomment the flavour you want below:
    # "~/.config/alacritty/themes/catppuccin-latte.toml",
    # "~/.config/alacritty/themes/catppuccin-frappe.toml"
    # "~/.config/alacritty/themes/catppuccin-macchiato.toml"
    # "~/.config/alacritty/themes/catppuccin-mocha.toml",
    # "~/.config/alacritty/themes/gruvbox_dark.toml"
    # "~/.config/alacritty/themes/gruvbox_light.toml"
    # "~/.config/alacritty/themes/github_light.toml"
    # "~/.config/alacritty/themes/github_dark.toml"
    # "~/.config/alacritty/themes/pencil_light.toml"
    # "~/.config/alacritty/themes/papercolor_light.toml",
    # "~/.config/alacritty/themes/kanagawa_wave.toml",
    "~/.config/alacritty/themes/kanagawa_dragon.toml",
    # "~/.config/alacritty/themes/kanagawa_lotus.toml",
    "~/.config/alacritty/local.toml",
]
