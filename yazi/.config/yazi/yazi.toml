[preview]
image_quality = 90

[opener]
skim = [
	{ run = "open -a Skim %s", desc = "Skim", for = "macos" },
]
xournal = [
	{ run = "xournalpp %s", desc = "Xournal++", orphan = true, for = "linux" },
]

[open]
prepend_rules = [
	{ mime = "application/pdf", use = [ "open", "skim", "xournal", "reveal" ] },
]
