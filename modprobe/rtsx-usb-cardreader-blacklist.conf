# Realtek USB card reader on the StarLite - the SD slot is hardly ever used.
#
# rtsx_usb_sdmmc's card-detect rescan (mmc_rescan -> mmc_attach_sd ->
# usb_bulk_msg) can wedge on a bulk transfer the reader never answers,
# leaving a kworker in uninterruptible sleep for days. That pins
# /proc/pressure/io at ~90% while the disk is idle. Seen 2026-10-26,
# stuck 52h until reboot.
#
# Keep both card-reader child drivers from autoloading. rtsx_usb (the
# parent USB driver) still binds, so re-enable by deleting this file if
# the SD slot is ever needed.
blacklist rtsx_usb_sdmmc
blacklist rtsx_usb_ms
